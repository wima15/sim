name: Ping Supabase (keep-alive)

# Menjaga project Supabase free-tier tetap aktif dengan melakukan
# request kecil secara berkala. Project Supabase gratis akan
# di-pause otomatis oleh Supabase jika tidak ada aktivitas selama ±7 hari.

on:
  schedule:
    # Jalan setiap hari jam 03:00 UTC (± 10:00 WIB)
    - cron: "0 3 * * *"
  workflow_dispatch: {} # supaya bisa dijalankan manual dari tab "Actions"

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase table
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "SUPABASE_URL / SUPABASE_KEY belum diset di Settings > Secrets."
            exit 1
          fi

          http_status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/school_config?select=id&id=eq.main" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY")

          echo "HTTP status: $http_status"
          cat /tmp/response.json
          echo ""

          if [ "$http_status" -ge 200 ] && [ "$http_status" -lt 300 ]; then
            echo "✅ Ping berhasil, Supabase tetap aktif."
          else
            echo "❌ Ping gagal dengan status $http_status"
            exit 1
          fi
