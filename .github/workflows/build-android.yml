name: Build APK Android

# APK dibuat otomatis tiap ada perubahan pada file aplikasi,
# atau manual lewat tab Actions > "Build APK Android" > Run workflow.
on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "notifications.js"
      - "android-download.js"
      - "runners/**"
      - "capacitor.config.json"
      - "package.json"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/build-android.yml"
  workflow_dispatch: {}

permissions:
  contents: write   # untuk menerbitkan APK ke halaman Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependency
        run: npm install --legacy-peer-deps

      - name: Siapkan www + proyek Android
        env:
          WEB_URL: ${{ vars.WEB_URL }}   # opsional, lihat README
        run: |
          node scripts/prepare-www.js
          test -d android || npx cap add android

      - name: Buat ikon dari logo sekolah
        continue-on-error: true   # bila gagal, dipakai ikon bawaan
        run: npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff'

      - name: Patch izin, ikon notifikasi, versi
        run: node scripts/patch-android.js

      - name: Sinkronkan Capacitor
        run: npx cap sync android

      - name: Build APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Ganti nama APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Edu-Wima.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Edu-Wima-apk
          path: Edu-Wima.apk

      - name: Terbitkan ke Releases (link unduhan tetap)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Aplikasi Android (versi terbaru)
          body: "APK terbaru Edu-Wima (portal SMK Widya Mandala Tambak). Unduh file Edu-Wima.apk lalu pasang di HP."
          files: Edu-Wima.apk
